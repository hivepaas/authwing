[package]
name = "authwing-backup"
description = "authwing's encrypted backup, the plain export, and imports from other authenticator apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
authwing-totp.workspace = true
# authwing's own backup: a key from the passphrase and a cipher, as the vault's.
argon2 = "0.6"
chacha20poly1305 = "0.10"
getrandom = "0.3"
# Aegis, 2FAS and Proton Authenticator seal with AES-256-GCM, under a key
# from scrypt (Aegis), PBKDF2-SHA256 (2FAS) or Argon2id (Proton, with the
# argon2 above). The digest 0.10 family, as the vault's sha2 and hkdf.
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
pbkdf2 = "0.12"
sha2 = "0.10"
# andOTP's backups and Stratum's older ones take their key from
# PBKDF2-HMAC-SHA1; Stratum's older ones, TOTP Authenticator's and
# Bitwarden's password-protected export are sealed with AES-256-CBC, the
# last with HMAC-SHA256 under two keys HKDF-SHA256 stretches from the
# password's (PBKDF2 or Argon2id). The digest 0.10 and cipher 0.4 family,
# as aes-gcm's.
sha1 = "0.10"
aes = "0.8"
cbc = "0.1"
hkdf = "0.12"
hmac = "0.12"
base64 = "0.22"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
# Bitwarden's login addresses, read as the browser reads them.
url = "2.5"
zeroize = "1"

[lints]
workspace = true
