[package]
name = "authwing"
description = "Two-factor codes that know the window you are in"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "authwing"
path = "src/main.rs"

[features]
default = ["wayland", "x11"]
# Linux window system backends. Build with `--no-default-features --features wayland`
# when the X11 development libraries are not installed.
wayland = ["gpui_platform/wayland"]
x11 = ["gpui_platform/x11"]

[dependencies]
authwing-config.workspace = true
authwing-vault.workspace = true
authwing-remote.workspace = true
authwing-i18n.workspace = true
authwing-presence.workspace = true
authwing-totp.workspace = true
authwing-context.workspace = true
authwing-bridge.workspace = true
authwing-backup.workspace = true
authwing-scan.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
anyhow.workspace = true
async-channel.workspace = true
unicode-segmentation = "1"
# The quick panel: a shortcut that works over any app, and the code typed
# into that app.
global-hotkey = "0.9"
enigo = "0.6"
# The clipboard's copy of a code, wiped from memory when dropped.
zeroize = "1"

# To write `--help` and errors to the terminal the app was started from: a GUI
# program on Windows has no console of its own (see main.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

# Puts the icon and the version into authwing.exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# The workspace's lints, except that unsafe code is denied rather than
# forbidden: one Win32 call (AttachConsole, in main.rs) allows it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "deny"
