[package]
name = "authwing-voice"
description = "Finding the account the user names aloud, and hearing it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Speech to text with whisper.cpp (builds it with CMake; Metal on macOS).
whisper = ["dep:whisper-rs", "dep:thiserror"]
# Hold-to-talk recording from the default microphone.
mic = ["dep:cpal", "dep:thiserror"]

[dependencies]
deunicode = "1.6"
strsim = "0.11"
sys-locale = "0.3"
thiserror = { workspace = true, optional = true }
whisper-rs = { version = "0.16", optional = true }
cpal = { version = "0.18", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", optional = true, features = ["metal"] }

[dev-dependencies]
hound = "3.5"

[lints]
workspace = true
