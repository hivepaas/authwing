<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>authwing</title>
    <style>
      :root {
        color-scheme: light dark;
        --text: #1d1d1f;
        --quiet: #6e6e73;
        --back: #ffffff;
        --line: #d2d2d7;
        --linked: #2e9b4f;
        --unlinked: #b8860b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #f5f5f7;
          --quiet: #a1a1a6;
          --back: #1c1c1e;
          --line: #3a3a3c;
          --linked: #4cc26f;
          --unlinked: #e0b341;
        }
      }
      body {
        margin: 0;
        padding: 14px 16px;
        width: 280px;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--back);
      }
      .state {
        display: flex;
        gap: 8px;
        align-items: baseline;
        font-weight: 600;
      }
      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--unlinked);
      }
      .linked .dot {
        background: var(--linked);
      }
      p {
        margin: 8px 0 0;
        color: var(--quiet);
      }
      button {
        margin-top: 12px;
        padding: 5px 12px;
        font: inherit;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="link" class="state"><span class="dot"></span><span id="text">…</span></div>
    <p id="detail" hidden></p>
    <button id="retry" type="button" hidden>Try again</button>
    <div id="sites" hidden>
      <p>authwing cannot find code fields until the extension may read sites.</p>
      <button id="allow" type="button">Allow on all sites</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
