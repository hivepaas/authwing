[workspace]
resolver = "3"
members = ["crates/*"]
# Third-party crates taken in to patch: not ours to lint (see each UPSTREAM.md).
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/hivepaas/authwing"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
authwing-config = { path = "crates/config" }
authwing-vault = { path = "crates/vault" }
authwing-remote = { path = "crates/remote" }
authwing-presence = { path = "crates/presence" }
authwing-i18n = { path = "crates/i18n" }
authwing-update = { path = "crates/update" }
authwing-spawn = { path = "crates/spawn" }
authwing-totp = { path = "crates/totp" }
authwing-context = { path = "crates/context" }
authwing-voice = { path = "crates/voice" }
authwing-bridge = { path = "crates/bridge" }
authwing-backup = { path = "crates/backup" }
authwing-scan = { path = "crates/scan" }
# GPUI as published by Longbridge (the same snapshot tern and gpui-kit use).
gpui = { package = "gpui-pre", version = "=0.3.9" }
# font-kit and runtime_shaders only affect macOS; the Linux backends are app features.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
async-channel = "2"
anyhow = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Dependencies optimised in dev builds too: GPUI and the crypto are slow unoptimised.
[profile.dev.package."*"]
opt-level = 2

# The UI tests on CI (`--profile ui-tests`): release speed, with debug
# assertions: GPUI records where elements are drawn only with them, so the
# tests could not click without, and they catch what only a debug build would.
[profile.ui-tests]
inherits = "release"
debug-assertions = true

# GPUI's Linux platform, taken in for a fix (vendor/gpui-pre-linux/UPSTREAM.md).
[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
